<section class="section news-section" id="news" aria-labelledby="news-title">
  <div class="section-heading"><h2 id="news-title">News</h2></div>
  <div class="news-content"><ul class="news-list">{% for item in site.data.news limit: 5 %}<li><time datetime="{{ item.date }}">{{ item.label }}</time><div>{{ item.text }}</div></li>{% endfor %}</ul>
    <details class="news-archive"><summary>Earlier news <span aria-hidden="true">+</span></summary><ul class="news-list">{% for item in site.data.news offset: 5 %}<li><time datetime="{{ item.date }}">{{ item.label }}</time><div>{{ item.text }}</div></li>{% endfor %}</ul></details>
  </div>
</section>
