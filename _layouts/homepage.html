<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ site.title }} — {{ site.tagline }}</title>
  <meta name="description" content="{{ site.description | escape }}">
  <meta name="theme-color" content="#28584F">
  <link rel="canonical" href="{{ site.url }}{{ site.baseurl }}/">
  <meta property="og:type" content="website">
  <meta property="og:title" content="{{ site.title }} — {{ site.tagline }}">
  <meta property="og:description" content="{{ site.description | escape }}">
  <meta property="og:url" content="{{ site.url }}{{ site.baseurl }}/">
  <meta property="og:image" content="{{ site.avatar | absolute_url }}">
  <link rel="icon" href="{{ '/assets/img/favicon.svg' | relative_url }}" type="image/svg+xml">
  <link rel="stylesheet" href="{{ '/assets/css/home.css' | relative_url }}">
  <script src="{{ '/assets/js/theme.js' | relative_url }}"></script>
  <script src="{{ '/assets/js/home.js' | relative_url }}" defer></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header">
    <div class="container header-inner">
      <nav aria-label="Main navigation"><a href="#bio">Bio</a><a href="#news">News</a><a href="#publications">Publications</a><a href="#service">Service</a></nav>
      <button class="theme-toggle" type="button" aria-label="Switch to dark theme" hidden><span aria-hidden="true">◐</span></button>
    </div>
  </header>
  <main id="main" class="container">{{ content }}</main>
  <footer class="site-footer container"><p>Chao Wang</p><a href="mailto:{{ site.email }}">{{ site.email }}</a></footer>
</body>
</html>
